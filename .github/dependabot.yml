version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - eslint*
          - prettier
          - "@commitlint/*"
          - husky
          - lint-staged
          - typescript
          - nx
    ignore:
      # Expo SDK, React Native, and every expo-* package move together as a
      # pinned set (see AGENTS.md's "Expo HAS CHANGED" note) — bump these only
      # via `npx expo install`, which resolves the whole set consistently,
      # never through an independent Dependabot PR.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "react"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-navigation/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
